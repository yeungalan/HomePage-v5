name: Cypress E2E

# Runs the Cypress end-to-end suite that checks the site renders correctly in
# every supported language and that all interactive controls are clickable.
#
# The tests live in their own package under ./test so their dependencies never
# touch the app in ./homepage. This job builds and starts the homepage app, then
# runs Cypress (from ./test) against it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  cypress:
    name: Run Cypress tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            homepage/package-lock.json
            test/package-lock.json

      # The homepage project resolves with --legacy-peer-deps (a transitive dep
      # still pins React 18 while the app uses React 19).
      - name: Install homepage dependencies
        working-directory: homepage
        run: npm ci --legacy-peer-deps

      - name: Build homepage
        working-directory: homepage
        run: npm run build

      - name: Run Cypress
        id: cypress
        # Never fail the step itself: a comprehensive suite covering every
        # component is expected to occasionally catch a real regression, and
        # the report must still be generated and posted to the PR when that
        # happens. The job is failed explicitly at the end based on the
        # outcome captured here.
        continue-on-error: true
        uses: cypress-io/github-action@v6
        with:
          working-directory: test
          start: npm run start:app
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180
          browser: chrome

      - name: Upload screenshots on failure
        if: steps.cypress.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: test/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload mochawesome HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report
          path: test/cypress/reports
          if-no-files-found: ignore

      - name: Post/update the PR comment with the test report
        if: always() && github.event_name == 'pull_request'
        working-directory: test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run report:comment

      - name: Fail the job if Cypress failed
        if: steps.cypress.outcome == 'failure'
        run: exit 1
