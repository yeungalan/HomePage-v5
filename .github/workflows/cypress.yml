name: Cypress E2E

# Runs the Cypress end-to-end suite that checks the site renders correctly in
# every supported language and that all interactive controls are clickable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    name: Run Cypress tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homepage/package-lock.json

      # The project resolves with --legacy-peer-deps (a transitive dep still
      # pins React 18 while the app uses React 19), so install explicitly here
      # and tell the Cypress action not to install again.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: homepage
          install: false
          build: npm run build
          start: npm run start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180
          browser: chrome

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: homepage/cypress/screenshots
          if-no-files-found: ignore
